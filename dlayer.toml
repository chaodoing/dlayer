# ==============================================================================
# dlayer 代码生成器配置文件 (TOML 格式)
# ==============================================================================

# Web 框架，支持 iris, gin
framework = "iris"

# 数据库驱动，支持 mysql, tidb, postgres, gaussdb, sqlite, sqlserver, clickhouse, dm, oracle
driver = "dm"

# 数据库连接字符串 (DSN)
dsn = "dm://SYSDBA:123.com@127.0.0.1:30236?schema=SAFE"

# 代码生成根输出目录
out_dir = "http"

# 子目录输出配置 (留空时基于 out_dir 扩展)
model_out = "http/models"
query_out = "http/query"
validator_out = "http/request"
validator_package = "request"

# 数据库表过滤 (为空数组 [] 时默认生成数据库中的全部表)
tables = []

# 表名前缀裁剪 (如 sys_，生成模型与结构体名称时会自动剥离该前缀)
table_prefix = ""

# 生成验证结构时跳过的数据库列
ignore_fields = ["created_at", "updated_at", "deleted_at"]

# 验证结构体字段上生成的 Tag 名称
tags = ["json", "form", "xml", "url"]

# gookit/validate 场景名称配置
insert_scene = "insert"
update_scene = "update"
delete_scene = "delete"

# 全局数据库数据类型到 Go 类型的映射
[type_mappings.date]
db_type = "date"
go_type = "calendar.Date"
import_path = "pkg/calendar"

[type_mappings.datetime]
db_type = "datetime"
go_type = "calendar.Datetime"
import_path = "pkg/calendar"

[type_mappings.json]
db_type = "json"
go_type = "datatypes.JSON"
import_path = "gorm.io/datatypes"

[type_mappings.jsonb]
db_type = "jsonb"
go_type = "datatypes.JSON"
import_path = "gorm.io/datatypes"

[type_mappings.month]
db_type = "month"
go_type = "calendar.Month"
import_path = "pkg/calendar"

[type_mappings.time]
db_type = "time"
go_type = "calendar.Time"
import_path = "pkg/calendar"

[type_mappings.timestamp]
db_type = "timestamp"
go_type = "calendar.Datetime"
import_path = "pkg/calendar"

[type_mappings.unix]
db_type = "unix"
go_type = "calendar.Unix"
import_path = "pkg/calendar"

[type_mappings.uuid]
db_type = "uuid"
go_type = "uuid.UUID"
import_path = "github.com/google/uuid"

